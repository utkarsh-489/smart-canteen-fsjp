name: Smart Canteen Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build


  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        run: mvn -B -DskipTests package


  docker-build:
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-build

    env:
      MYSQL_ROOT_PASSWORD: ci-test-password
      MYSQL_DATABASE: smart_canteen_db
      APP_JWT_SECRET: ci-test-jwt-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build backend Docker image
        run: docker build -t smart-canteen-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t smart-canteen-frontend:ci ./frontend

      - name: Verify Docker images
        run: docker image inspect smart-canteen-backend:ci && docker image inspect smart-canteen-frontend:ci

